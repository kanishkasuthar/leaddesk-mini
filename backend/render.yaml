services:
  - type: web
    name: leaddesk-mini-backend
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: leaddesk
      - key: DB_PORT
        value: 3306
      - key: FRONTEND_URL
        value: https://leaddesk-mini.vercel.app
